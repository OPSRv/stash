name: Warm build cache

# GitHub Actions caches are scoped to the ref that saved them, and a run on a
# tag can only restore caches from its own tag or the default branch. Release
# runs fire on fresh `v*` tags, so without this workflow they never find a
# Rust cache and compile everything from scratch (~15 min).
#
# This job runs the same build as `release.yml` on every push to `main` and
# saves the cache under `main`, which tag runs can then restore. Keep the
# toolchain, target, `shared-key` and build commands in sync with
# `release.yml` — any drift changes the cache key or the compiled artefacts
# and the release falls back to a cold build.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package-lock.json'
      - '.github/workflows/cache-warm.yml'
  workflow_dispatch:

# A newer push to main supersedes an in-flight warm-up.
concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  warm:
    name: Warm macOS arm64 cache
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Portable ggml build for whisper-rs-sys: no -mcpu=native, so the binary
      # doesn't inherit the runner CPU's features (macos-15 clang rejected the
      # native i8mm path) and still runs on base M1 Macs. GGML_NATIVE defaults
      # OFF only when CMake cross-compiles, which an explicit CMAKE_SYSTEM_NAME
      # triggers; whisper-rs-sys forwards CMAKE_* env vars to its CMake build.
      # (WHISPER_NATIVE=OFF does nothing — the alias only maps ON.)
      CMAKE_SYSTEM_NAME: Darwin
      CMAKE_SYSTEM_PROCESSOR: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-arm64

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sherpa-rs
          key: sherpa-rs-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sherpa-rs-${{ runner.os }}-

      - run: npm ci

      # `--no-bundle` skips DMG/updater packaging (and the signing key) —
      # only the compiled Rust artefacts matter for the cache.
      - name: Build main app (arm64)
        run: npm run tauri build -- --target aarch64-apple-darwin --no-bundle

      - name: Build diarization sidecar
        working-directory: src-tauri
        # Cargo >= 1.100 uses the new build-dir layout with no
        # `<profile>/deps`; sherpa-rs-sys 0.6.8's build script still copies
        # the onnx dylibs there and panics when the dir is missing.
        run: |
          mkdir -p target/aarch64-apple-darwin/release/deps
          cargo build -p stash-diarize --release --target aarch64-apple-darwin
